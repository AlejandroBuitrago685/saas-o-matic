<!-- Two blocks with their icon (D-191): the company and the subscription. The fields keep the order of spec 05 §3.2,
     which is also the order of the Tab key; from 640 px the tax id and the email share a row. -->
<form class="card flex flex-col gap-6" novalidate aria-label="Datos del cliente" (submit)="onSubmit($event)">
  <fieldset class="flex flex-col gap-5">
    <legend class="mb-5 flex items-center gap-3 text-title-sm font-extrabold text-ink sm:text-title-lg">
      <app-icon name="building" class="size-7 text-primary" />Datos de la empresa
    </legend>

    <div class="field">
      <label class="label" for="customer-country">País</label>
      <div class="relative">
        <select id="customer-country" class="input select" [formField]="customerForm.country">
          @for (country of countries(); track country.code) {
            <option [value]="country.code">{{ country.name }}</option>
          }
        </select>
        <app-icon
          name="chevron-down"
          class="pointer-events-none absolute top-1/2 right-4 size-5 -translate-y-1/2 text-ink-soft"
        />
      </div>
    </div>

    <div class="field">
      <label class="label" for="customer-company">Nombre de empresa</label>
      <input
        id="customer-company"
        class="input"
        type="text"
        autocomplete="organization"
        [formField]="customerForm.companyName"
        [attr.aria-invalid]="isShowingError(customerForm.companyName()) || null"
        aria-describedby="customer-company-error"
      />
      <app-field-error [state]="customerForm.companyName()" errorId="customer-company-error" />
    </div>

    <div class="grid grid-cols-1 items-start gap-5 sm:grid-cols-2">
      <div class="field">
        <label class="label" for="customer-tax-id">{{ taxIdText().label }}</label>
        <input
          id="customer-tax-id"
          class="input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          [formField]="customerForm.taxId"
          [attr.aria-invalid]="isShowingError(customerForm.taxId()) || null"
          aria-describedby="customer-tax-id-hint customer-tax-id-error"
        />
        <p id="customer-tax-id-hint" class="hint">Ejemplo: {{ taxIdText().example }}</p>
        <app-field-error [state]="customerForm.taxId()" errorId="customer-tax-id-error" />
      </div>

      <div class="field">
        <label class="label" for="customer-email">Email de contacto</label>
        <input
          id="customer-email"
          class="input"
          type="email"
          autocomplete="email"
          placeholder="nombre@empresa.com"
          [formField]="customerForm.contactEmail"
          [attr.aria-invalid]="isShowingError(customerForm.contactEmail()) || null"
          aria-describedby="customer-email-error"
        />
        <app-field-error [state]="customerForm.contactEmail()" errorId="customer-email-error" />
      </div>
    </div>
  </fieldset>

  <hr class="border-line" />

  <fieldset class="flex flex-col gap-5">
    <legend class="mb-5 flex items-center gap-3 text-title-sm font-extrabold text-ink sm:text-title-lg">
      <app-icon name="layers" class="size-7 text-primary" />Suscripción
    </legend>

    <div class="field">
      <label class="label" for="customer-plan">Plan</label>
      <div class="relative">
        <select
          id="customer-plan"
          class="input select"
          [formField]="customerForm.plan"
          [attr.aria-invalid]="isShowingError(customerForm.plan()) || null"
          aria-describedby="customer-plan-error"
        >
          <option value="">Selecciona un plan</option>
          @for (plan of plans(); track plan) {
            <option [value]="plan">{{ plan }}</option>
          }
        </select>
        <app-icon
          name="chevron-down"
          class="pointer-events-none absolute top-1/2 right-4 size-5 -translate-y-1/2 text-ink-soft"
        />
      </div>
      <app-field-error [state]="customerForm.plan()" errorId="customer-plan-error" />
    </div>
  </fieldset>

  @if (notice(); as current) {
    <div role="alert" class="alert alert-danger">
      <app-icon name="circle-alert" class="mt-0.5 size-5" />
      <div class="flex flex-col items-start gap-1 sm:flex-row sm:items-center sm:gap-4">
        <p class="font-semibold">{{ current.message }}</p>
        @if (current.existingCustomerId; as existingId) {
          <a class="link" [routerLink]="['/customers', existingId]">Ver cliente</a>
        }
      </div>
    </div>
  }

  <button
    type="submit"
    class="btn btn-primary min-h-13 w-full text-title-sm"
    [disabled]="customerForm().submitting()"
  >
    @if (customerForm().submitting()) {
      <app-spinner />
    }
    Crear cliente
  </button>
</form>
