<!-- While a new search loads, the previous results stay dimmed: no skeleton and no jump of the layout. -->
<ul
  class="grid grid-cols-1 gap-4 transition-opacity sm:grid-cols-2 lg:grid-cols-3"
  [class.opacity-60]="store.isRefreshing()"
  [attr.aria-busy]="store.isRefreshing() || null"
  aria-label="Clientes"
>
  @for (customer of store.items(); track customer.id) {
    <li><app-customer-summary-card [customer]="customer" /></li>
  }
</ul>

<!-- aria-disabled, not disabled: a disabled button loses the focus of whoever just pressed it (spec 05 §5). The
     store ignores the click while it cannot go there. The range goes first and the buttons together on the right
     (D-191); on a phone the buttons share the row below. -->
<nav
  aria-label="Paginación"
  class="mt-6 flex flex-wrap items-center justify-between gap-x-4 gap-y-3 border-t border-line pt-5"
>
  <p class="flex min-h-11 items-center gap-2 text-small font-semibold text-ink-soft" aria-live="polite">
    @if (store.isRefreshing()) {
      <app-spinner /> Buscando…
    } @else {
      {{ rangeText() }}
    }
  </p>
  <div class="flex flex-1 justify-end gap-3 sm:flex-none">
    <button
      type="button"
      class="btn btn-secondary flex-1 sm:flex-none"
      [attr.aria-disabled]="!canGoBack()"
      (click)="store.previous()"
    >
      <app-icon name="arrow-left" class="size-5" />Anterior
    </button>
    <button
      type="button"
      class="btn btn-secondary flex-1 sm:flex-none"
      [attr.aria-disabled]="!canGoForward()"
      (click)="store.next()"
    >
      Siguiente<app-icon name="arrow-right" class="size-5" />
    </button>
  </div>
</nav>
