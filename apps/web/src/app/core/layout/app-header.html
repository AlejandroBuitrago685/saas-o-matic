<header class="bg-surface shadow-header">
  <!-- Phones: wordmark and the primary action on the first row, navigation below, then the currency bar (rates
       indicator and selector, spec 05 §4.4). From 640 px the first three share a row and the currency bar has its
       own; from 1024 px everything fits in one row. -->
  <div class="mx-auto flex max-w-app flex-wrap items-center gap-x-6 px-4 sm:min-h-16 sm:px-6">
    <a
      routerLink="/"
      class="order-1 flex min-h-14 items-center rounded-sm text-title-sm font-extrabold text-ink"
      aria-label="SaaS-O-Matic, inicio"
    >
      SaaS-<span class="text-primary">O-Matic</span>
    </a>

    <nav aria-label="Principal" class="order-3 w-full border-t border-line sm:order-2 sm:w-auto sm:border-0">
      <ul class="flex gap-6">
        <li>
          <a routerLink="/" class="nav-link" [attr.aria-current]="isCustomersSection() ? 'page' : null"
            >Clientes</a
          >
        </li>
      </ul>
    </nav>

    <app-currency-bar
      data-testid="currency-bar"
      class="order-4 block w-full border-t border-line py-2 lg:order-3 lg:ml-auto lg:w-auto lg:border-0"
    />

    <div
      data-testid="header-tools"
      class="order-2 ml-auto flex flex-wrap items-center justify-end gap-3 sm:order-3 lg:order-4 lg:ml-0"
    >
      <a routerLink="/customers/new" class="btn btn-primary min-h-11 px-4">Nuevo cliente</a>
    </div>
  </div>
</header>
