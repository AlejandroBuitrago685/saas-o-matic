<header class="bg-surface shadow-header">
  <!-- Phones: wordmark and navigation, then the currency bar (rates indicator and selector, spec 05 §4.4), then the
       primary action across the width. From 640 px the action joins the first row; from 1024 px everything fits in
       one row. Only from 640 px does the header stick (D-191): on a phone three rows would take too much screen. -->
  <div
    class="mx-auto flex max-w-app flex-wrap items-center gap-x-5 px-4 pb-3 sm:min-h-16 sm:px-6 sm:pb-0 lg:gap-x-6"
  >
    <a
      routerLink="/"
      class="order-1 flex min-h-14 items-center rounded-sm text-title-sm font-extrabold tracking-tight text-ink sm:text-title-lg"
      aria-label="SaaS-O-Matic, inicio"
    >
      SaaS-<span class="text-primary">O-Matic</span>
    </a>

    <nav aria-label="Principal" class="order-2 border-l border-line pl-5 lg:pl-6">
      <ul class="flex gap-6">
        <li>
          <a routerLink="/" class="nav-link" [attr.aria-current]="isCustomersSection() ? 'page' : null"
            >Clientes</a
          >
        </li>
      </ul>
    </nav>

    <app-currency-bar
      data-testid="currency-bar"
      class="order-3 block w-full border-t border-line py-2 sm:order-4 lg:order-3 lg:ml-auto lg:w-auto lg:border-0 lg:py-0"
    />

    <div data-testid="header-tools" class="order-4 w-full sm:order-3 sm:ml-auto sm:w-auto lg:order-4 lg:ml-0">
      <a routerLink="/customers/new" class="btn btn-primary min-h-11 w-full px-4 sm:w-auto"
        ><app-icon name="plus" class="size-5" />Nuevo cliente</a
      >
    </div>
  </div>
</header>
