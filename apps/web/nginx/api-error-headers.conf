# Headers of the responses nginx writes itself for /api/ (D-152, D-158): the API does not answer, or the body is too
# large to reach it. They are the same the API sends (apps/api/src/http/security-headers.ts and cache-control.ts,
# RNF-SEC-06, AC-52), never the ones of the SPA in security-headers.conf: that file carries the CSP of the interface,
# and a second Content-Security-Policy would be added. No HSTS: the API only sends it in production, behind HTTPS, and
# this nginx only speaks HTTP.
add_header Content-Security-Policy "default-src 'none';frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header X-Frame-Options "DENY" always;
add_header Cache-Control "no-store" always;
