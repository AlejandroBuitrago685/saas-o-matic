# nginx of the web container (08-despliegue §2, ADR-012): serves the SPA and forwards /api/ to the API, stripping the
# prefix. It runs as an unprivileged user with a read-only file system: the pid and the temporary files live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
# D-134: errors only, to stderr. Those lines include the request line; there is no access log (see below).
error_log /dev/stderr error;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # D-131: `Server: nginx`, without the version. The official image cannot remove the header.
  server_tokens off;
  # D-134: the access log would record client IPs and query strings; the API logs one line per request with the
  # route pattern and no personal data (RNF-SEC-11).
  access_log off;

  sendfile on;
  keepalive_timeout 65s;
  # D-132: above the 16 KiB of the API, so that its single error handler answers 413 in RFC 9457 (ADR-009); this only
  # stops abuse before it reaches Node.
  client_max_body_size 64k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Static files only: API responses are never compressed.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  upstream api {
    server api:3000;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;
    root /srv/saas-o-matic;

    # `^~`: a matching prefix stops the search, so the regex location of the hashed files below never takes an /api/
    # path (regression of the P6 review).
    location ^~ /api/ {
      # The trailing slash strips /api: /api/customers → /customers.
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # D-105, D-130: append this hop. The API trusts only this container (and, in the demo, the gateway the host
      # nginx comes through), so an address the client prepends is never taken as its IP.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # The API trusts this proxy, so the headers a client could forge through it are dropped.
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header Forwarded "";

      # D-152, AC-85: if the API does not answer, nginx answers for it in RFC 9457, like every other error of the API.
      error_page 502 @api_unreachable;
      error_page 504 @api_timeout;
      # D-153: those failures would log the request line, query included (T-12). The API is watched by its healthcheck
      # and the client gets the Problem below, so in /api/ only critical errors are logged.
      error_log /dev/stderr crit;
    }

    # The two answers of D-152: same code, the real status. No `instance`: the request never reached the API.
    location @api_unreachable {
      include /etc/nginx/api-error-headers.conf;
      default_type application/problem+json;
      return 502 '{"type":"/problems/service-unavailable","title":"Service unavailable","status":502,"detail":"The API is not responding. Try again in a few minutes.","code":"SERVICE_UNAVAILABLE"}';
    }

    location @api_timeout {
      include /etc/nginx/api-error-headers.conf;
      default_type application/problem+json;
      return 504 '{"type":"/problems/service-unavailable","title":"Service unavailable","status":504,"detail":"The API took too long to respond. Try again in a few minutes.","code":"SERVICE_UNAVAILABLE"}';
    }

    # Build outputs with a content hash (outputHashing: all): cached for a year.
    location ~ "-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$" {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html and the client routes of the SPA: always revalidated, so a new deployment is picked up at once.
    location / {
      try_files $uri /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
