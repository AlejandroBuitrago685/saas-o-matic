# Security headers of the interface (RNF-SEC-06, AC-52, AC-64). Included in every location of the SPA, never in /api/,
# where the API sends its own. `always` also puts them on the error pages nginx generates.
# No inline scripts or styles anywhere: Angular is built with inlineCritical: false (D-70) and components carry no
# styles (D-64, D-125). The fonts are self-hosted (D-123). The exchange-rate API is called from the browser (P8).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://open.er-api.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
